[project]
name = "locallens"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pillow>=12.3.0",
    "pypdfium2>=5.13.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
