[project]
name = "locallens"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mss>=10.2.0",
    "pillow>=12.3.0",
    "pypdfium2>=5.13.0",
    "pyside6>=6.11.2",
    "pytesseract>=0.3.13",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
