# Preset fascia VRAM bassa — default v1, validato su GTX 960M 4GB
id = "glm-ocr-q8_0"
display_name = "GLM-OCR Q8_0 (default, VRAM bassa)"
hf_repo = "ggml-org/GLM-OCR-GGUF"
gguf_file = "GLM-OCR-Q8_0.gguf"
mmproj_file = "mmproj-GLM-OCR-Q8_0.gguf"
