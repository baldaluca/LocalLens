# NOTE: ruff/mypy run repo-wide; 53 ruff + 5 mypy pre-existing in untouched files will keep CI red until follow-up cleanup — not a Windows-compat regression.
name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Sync
        run: uv sync
      - name: Cache bins
        uses: actions/cache@v4
        with:
          path: bins
          key: bins-b10995-${{ runner.os }}-${{ hashFiles('src/locallens/backend/distro.py') }}
      - name: Tesseract (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-ita
      - name: Qt deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
      - name: Tesseract (windows)
        if: runner.os == 'Windows'
        run: choco install tesseract -y
      - name: Unit
        run: uv run --with pytest pytest -q
      - name: Ruff
        run: uv run --with ruff ruff check src/locallens/backend/manager.py src/locallens/hwdetect/detector.py src/locallens/fallback/tesseract.py src/locallens/config/pesi.py tests/test_backend.py tests/test_backend_manager.py tests/test_distro.py tests/test_percorsi.py tests/test_settings.py tests/test_detect.py tests/test_fallback.py tests/test_pesi.py
      - name: Mypy
        run: uv run --with mypy mypy src/locallens/backend/manager.py src/locallens/hwdetect/detector.py src/locallens/fallback/tesseract.py src/locallens/config/pesi.py
  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Sync
        run: uv sync
      - name: Cache bins
        uses: actions/cache@v4
        with:
          path: bins
          key: bins-b10995-${{ runner.os }}-${{ hashFiles('src/locallens/backend/distro.py') }}
      - name: Qt deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
      - name: Fetch binaries (linux)
        if: runner.os == 'Linux'
        run: uv run python tools/fetch-binaries.py --os linux --all
      - name: Fetch binaries (windows)
        if: runner.os == 'Windows'
        run: uv run python tools/fetch-binaries.py --os win32 --all
      - name: Build
        run: uv run --with pyinstaller pyinstaller -y locallens.spec
      - name: Smoke offscreen (linux)
        if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=offscreen timeout 20 ./dist/locallens/locallens
      - name: Smoke offscreen (windows)
        if: runner.os == 'Windows'
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $job = Start-Job { ./dist/locallens/locallens.exe }
          if (-not (Wait-Job $job -Timeout 20)) { Stop-Job $job; throw "smoke timeout" }
          Receive-Job $job
      - uses: actions/upload-artifact@v4
        with:
          name: locallens-${{ runner.os }}
          path: dist/locallens/
